# MemoryCore standalone config — mounted read-only into the container.
# LLM credentials are injected via TDAI_LLM_* env vars (env wins over this file).
deployMode: standalone
stateBackend: local

server:
  port: 8420
  host: 0.0.0.0

data:
  baseDir: /data/tdai-memory

memory:
  promptMode: chat            # chat = general; code = code-engineering extraction
  capture: { enabled: true }
  extraction:
    enabled: true
    enableDedup: true
    maxMemoriesPerSession: 20
  pipeline:
    everyNConversations: 5
    enableWarmup: true
  recall:
    enabled: true
    maxResults: 5
    scoreThreshold: 0.3
    strategy: hybrid          # hybrid / embedding / keyword
  storeBackend: sqlite
  embedding:
    provider: none            # BM25 only — no embedding API costs

skill:
  enabled: true
  routing: { mode: bm25, searchTopK: 20 }
  extraction:
    enabled: true
    queue:
      backend: local
      keyPrefix: tdai
      resultTtlSeconds: 86400
      lockTtlMs: 600000
      maxRetries: 2
      retryBackoffsMs: [5000, 15000]
